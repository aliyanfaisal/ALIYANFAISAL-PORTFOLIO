name: Deploy to cPanel

# Freelance site -> freelance.aliyanfaisal.com. Auto-deploy stays OFF (manual runs only) until the site
# has been stripped of main-site pages and the server has its own .env and database.
# To enable: add  push: { branches: [main] }  under `on:`.
on:
  workflow_dispatch:

env:
  REMOTE_PATH: /home/wowzario/freelance.aliyanfaisal.com
  REMOTE_HOST: ${{ vars.CPANEL_SSH_HOST }}
  REMOTE_PORT: ${{ vars.CPANEL_SSH_PORT }}
  REMOTE_USER: ${{ vars.CPANEL_SSH_USERNAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Deploy files via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: >-
            -avzr --delete
            --exclude=.git*
            --exclude=.github/
            --exclude=node_modules/
            --exclude=tests/
            --exclude=.env
            --exclude=.env.example
            --exclude=storage/app/
            --exclude=storage/framework/cache/
            --exclude=storage/framework/sessions/
            --exclude=storage/framework/views/
            --exclude=storage/logs/
            --exclude=public/storage
            --exclude=.htaccess
            --exclude=phulkiee/
          path: ./
          remote_path: ${{ env.REMOTE_PATH }}
          remote_host: ${{ env.REMOTE_HOST }}
          remote_port: ${{ env.REMOTE_PORT }}
          remote_user: ${{ env.REMOTE_USER }}
          remote_key: ${{ secrets.CPANEL_SSH_KEY }}
          remote_key_pass: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}

      - name: Run post-deploy commands on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.REMOTE_HOST }}
          port: ${{ env.REMOTE_PORT }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
          script: |
            cd ${{ env.REMOTE_PATH }}
            # rsync excludes these runtime folders, so a fresh server folder won't have them.
            mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs storage/app/public bootstrap/cache
            chmod -R ug+rwX storage bootstrap/cache
            php artisan storage:link || true
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true
