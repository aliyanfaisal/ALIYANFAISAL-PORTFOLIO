name: Deploy to cPanel

# Production is deployed from this branch (main is kept as the untouched freelance-era snapshot).
on:
  push:
    branches:
      - portfolio-repositioning
  workflow_dispatch:
    inputs:
      run_seeders:
        description: 'Also re-run the content seeders (Setting, Skill, Experience, Education). Overwrites those tables, so use it for content updates only.'
        type: boolean
        default: false

env:
  REMOTE_PATH: /home/wowzario/aliyanfaisal.com
  REMOTE_HOST: ${{ vars.CPANEL_SSH_HOST }}
  REMOTE_PORT: ${{ vars.CPANEL_SSH_PORT }}
  REMOTE_USER: ${{ vars.CPANEL_SSH_USERNAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Deploy files via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: >-
            -avzr --delete
            --exclude=.git*
            --exclude=.github/
            --exclude=node_modules/
            --exclude=tests/
            --exclude=.env
            --exclude=.env.example
            --exclude=storage/app/
            --exclude=storage/framework/cache/
            --exclude=storage/framework/sessions/
            --exclude=storage/framework/views/
            --exclude=storage/logs/
            --exclude=public/storage
            --exclude=.htaccess
            --exclude=phulkiee/
          path: ./
          remote_path: ${{ env.REMOTE_PATH }}
          remote_host: ${{ env.REMOTE_HOST }}
          remote_port: ${{ env.REMOTE_PORT }}
          remote_user: ${{ env.REMOTE_USER }}
          remote_key: ${{ secrets.CPANEL_SSH_KEY }}
          remote_key_pass: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}

      - name: Run post-deploy commands on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.REMOTE_HOST }}
          port: ${{ env.REMOTE_PORT }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
          script: |
            cd ${{ env.REMOTE_PATH }}
            php artisan storage:link || true
            php artisan migrate --force
            if [ "${{ inputs.run_seeders }}" = "true" ]; then
              php artisan db:seed --class=SettingSeeder --force
              php artisan db:seed --class=SkillSeeder --force
              php artisan db:seed --class=ExperienceSeeder --force
              php artisan db:seed --class=EducationSeeder --force
            fi
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true
